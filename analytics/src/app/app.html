<div class="p-8">
  <h1 class="text-3xl font-bold text-gray-800 mb-2">Analytics</h1>
  <p class="text-gray-500 mb-8">Overview of key metrics and performance data.</p>

  <div class="grid grid-cols-3 gap-6 mb-8">
    <div class="bg-white rounded-xl shadow-sm p-6">
      <p class="text-2xl font-bold text-gray-800">2,481</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-6">
      <p class="text-sm text-gray-500 mb-1">Revenue</p>
      <p class="text-2xl font-bold text-gray-800">€18,240</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-6">
      <p class="text-sm text-gray-500 mb-1">Conversion Rate</p>
      <p class="text-2xl font-bold text-gray-800">3.2%</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm p-6">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Revenue Trend</h2>
    <ngx-charts-line-chart
      [results]="[{ name: 'Revenue', series: revenueData }]"
      [scheme]="colorScheme"
      [xAxis]="true"
      [yAxis]="true"
      [showXAxisLabel]="false"
      [showYAxisLabel]="false"
      [view]="[900, 300]"
    ></ngx-charts-line-chart>
  </div>

  <router-outlet></router-outlet>
</div>
