<div class="flex min-h-screen">
  <aside class="w-56 bg-[#1a1a2e] text-white p-6 flex flex-col">
    <h1 class="text-2xl font-bold mb-8">Nexus</h1>
    <nav class="flex flex-col gap-2">
      <a routerLink="/" routerLinkActive="bg-indigo-600 text-white" [routerLinkActiveOptions]="{ exact: true }"
        class="text-gray-300 no-underline px-3 py-2.5 rounded-md transition-colors hover:bg-white/10">Dashboard</a>
      <a routerLink="/analytics" routerLinkActive="bg-indigo-600 text-white"
        class="text-gray-300 no-underline px-3 py-2.5 rounded-md transition-colors hover:bg-white/10">Analytics</a>
      <a routerLink="/team" routerLinkActive="bg-indigo-600 text-white"
        class="text-gray-300 no-underline px-3 py-2.5 rounded-md transition-colors hover:bg-white/10">Team</a>
      <a routerLink="/settings" routerLinkActive="bg-indigo-600 text-white"
        class="text-gray-300 no-underline px-3 py-2.5 rounded-md transition-colors hover:bg-white/10">Settings</a>
    </nav>

    <div class="mt-auto pt-6 border-t border-white/10">
      <label class="text-xs text-gray-400 mb-1 block">Organization</label>
      <select class="w-full bg-white/10 text-white text-sm rounded-md px-2 py-2 border border-white/20"
        [value]="sharedState.activeOrg()" (change)="onOrgChange($event)">
        <option value="Acme Inc.">Acme Inc.</option>
        <option value="Globex Corp.">Globex Corp.</option>
        <option value="Initech">Initech</option>
      </select>
    </div>
  </aside>

  <main class="flex-1 p-8 bg-gray-50">
    <router-outlet></router-outlet>
  </main>
</div>
